server:
  port: 8081

spring:
  application:
    name: quickimageDEV

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  storage:
    original-location: D:/quickimage/originals
    cache-location: D:/quickimage/cached
  image:
    original-width: 800
    original-height: 800
    max: 2050
    min: 10
