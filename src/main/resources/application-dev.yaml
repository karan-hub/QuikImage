server:
  port: 8081

spring:
  application:
    name: quickimageDEV

  # --- ADD THIS SECTION ---
  data:
    redis:
      host: localhost
      port: 6379
  # ------------------------

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  storage:
    original-location: D:/quickimage/originals
    # Note: cache-location is technically unused now by our new logic!
    cache-location: D:/quickimage/cached
  image:
    original-width: 800
    original-height: 800
    max: 2050
    min: 10
    max-quality: 0.9
    min-quality: 0.2
    default-quality: 0.75